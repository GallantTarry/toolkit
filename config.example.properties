# ToolKit 外部服务配置模板（可选）
# 使用方法：
#   1. 将本文件复制为 ~/.toolkit/config.properties
#      （Windows 路径通常为 C:\Users\<你的用户名>\.toolkit\config.properties）
#   2. 填入你自己的 API Key 后保存（无需重新编译，部分功能可实时读取生效）
#   3. 也可以直接在操作系统环境变量中配置同名变量
#
# 注意：请勿将包含真实密钥的 config.properties 提交到版本库！

# DeepSeek API Key（用于 MITI 桌面小猫 AI 对话、地区助手文化简介）
DEEPSEEK_API_KEY=

# 高德 Web 服务 Key（用于地区助手街道/门牌级地理编码，未配置时仍可使用 6 位行政区划代码与离线字典查询）
AMAP_KEY=

# 《拯救公猪》全球排行榜后端接口（可选，基于 Cloudflare Workers + KV）
SAVEPIG_WORKER_URL=
SAVEPIG_GAME_KEY=
